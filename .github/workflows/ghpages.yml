name: Build & deploy to GitHub Pages

# Publishes straight to the Pages service instead of pushing a gh-pages branch.
#
# Branch publishing makes GitHub run its own `pages-build-deployment` workflow
# afterwards. That workflow is generated by GitHub under `dynamic/pages/`, not
# stored in this repo, so the actions it pins cannot be bumped from here — and
# one of them, actions/upload-artifact@v4, emits a Node 20 deprecation
# annotation on every deploy. Uploading the artifact ourselves is the only way
# to stop that pipeline running at all, and it drops a whole redundant build.

permissions:
  contents: read
  pages: write
  id-token: write

on:
  push:
    branches:
      - master
  workflow_dispatch:

# Never cancel a deploy in flight: a half-finished one leaves the live site in
# a partially published state, which is worse than waiting for it.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  HUGO_VERSION: 0.164.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Hugo
        run: |
          curl -sSLo hugo.deb "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i hugo.deb

      - name: Build
        run: hugo --minify --gc --printPathWarnings --printUnusedTemplates

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
